    <script>
      (function () {
        var base = null, anime = null;
        try {
        base = localStorage.getItem("codem-theme");
          anime = localStorage.getItem("codem-theme-anime");
          } catch (e) {}
        var theme = anime === "on" ? "anime"
      : (base === "light" || base === "dark"
    ? base
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
